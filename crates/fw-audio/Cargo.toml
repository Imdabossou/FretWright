[package]
name = "fw-audio"
description = "Audio for Rocksmith 2014 packages: decoding, resampling, loudness, preview clips and Wwise-free .wem encoding"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
thiserror.workspace = true
symphonia = { version = "0.5", default-features = false, features = ["mp3", "flac", "ogg", "vorbis", "wav", "pcm", "aac", "isomp4", "alac", "adpcm"] }
rayon.workspace = true
wem-core = { path = "../../third_party/wem/crates/wem-core", features = ["parallel"] }

[lints]
workspace = true
