[package]
name = "fw-models"
description = "Neural networks for FretWright in pure Rust: Beat This! beat tracking (rten) and Demucs source separation (burn, GPU via wgpu)"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[features]
default = ["demucs"]
# Demucs source separation; pulls in burn with the wgpu (GPU) and ndarray (CPU) backends
demucs = ["dep:demucs-core", "dep:burn", "dep:burn-ndarray", "dep:cubecl", "dep:pollster"]

[dependencies]
thiserror.workspace = true
rayon.workspace = true
realfft = "3"
rten = "0.24"
rten-tensor = "0.24"
ureq = "3"
sha2 = "0.10"
demucs-core = { path = "../../third_party/demucs-rs/demucs-core", features = ["wgpu", "ndarray", "autotune"], optional = true }
burn = { version = "0.20.1", default-features = false, features = ["std", "wgpu", "ndarray", "autotune"], optional = true }
# multi-threaded CPU fallback (not reachable through the burn facade)
burn-ndarray = { version = "0.20.1", features = ["multi-threads"], optional = true }
cubecl = { version = "0.9", default-features = false, optional = true }
pollster = { version = "0.4", optional = true }

[target.'cfg(target_os = "macos")'.dependencies]
burn = { version = "0.20.1", default-features = false, features = ["metal"], optional = true }

[target.'cfg(not(target_os = "macos"))'.dependencies]
burn = { version = "0.20.1", default-features = false, features = ["vulkan"], optional = true }

[dev-dependencies]
serde_json = "1"
fw-audio = { path = "../fw-audio" }

[lints]
workspace = true
