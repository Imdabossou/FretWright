[package]
name = "fw-cli"
description = "FretWright command line"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[[bin]]
name = "fretwright-cli"
path = "src/main.rs"

[dependencies]
fw-psarc = { path = "../fw-psarc" }
fw-sng = { path = "../fw-sng" }
fw-xml = { path = "../fw-xml" }
fw-audio = { path = "../fw-audio" }
fw-package = { path = "../fw-package" }
fw-project = { path = "../fw-project" }
fw-detect = { path = "../fw-detect" }
fw-models = { path = "../fw-models" }
fw-eval = { path = "../fw-eval" }
serde_json = "1"
clap = { version = "4.5", features = ["derive"] }
anyhow = "1"
walkdir = "2"

[lints]
workspace = true
