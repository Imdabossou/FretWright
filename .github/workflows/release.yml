# Tests every push; builds release bundles for Linux, Windows and macOS.
# Push a tag like v1.0.0 to publish them as a GitHub release (the model files
# live in a separate "models-1" release, see docs/RELEASING.md).
name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with: { components: clippy }
      - name: System libraries (ALSA headers for audio output)
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --release --locked

  bundle:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          # 22.04 keeps the glibc requirement low for older distributions
          - { os: ubuntu-22.04, platform: linux-x64 }
          - { os: windows-latest, platform: windows-x64 }
          - { os: macos-14, platform: macos-arm64 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Linux packaging tools
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update && sudo apt-get install -y libasound2-dev libfuse2 desktop-file-utils
          curl -fsSL -o appimagetool https://github.com/AppImage/appimagetool/releases/download/1.9.0/appimagetool-x86_64.AppImage
          chmod +x appimagetool && echo "APPIMAGETOOL=$PWD/appimagetool" >> "$GITHUB_ENV"
      - name: Package
        shell: bash
        run: |
          extra=""
          if [ "$RUNNER_OS" = "Linux" ]; then extra="--appimage"; fi
          cargo xtask package --platform ${{ matrix.platform }} $extra
      - uses: actions/upload-artifact@v4
        with:
          name: fretwright-${{ matrix.platform }}
          path: |
            dist/*.tar.gz
            dist/*.zip
            dist/*.AppImage

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: bundle
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with: { path: dist, merge-multiple: true }
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
